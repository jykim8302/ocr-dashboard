<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1인칭 컨트롤러 + 타겟 포커스</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0b0e14;
    font-family: "Pretendard", "Malgun Gothic", -apple-system, system-ui, sans-serif; color:#e8edf5; }
  canvas { display:block; cursor:none; }
  .ui { position:fixed; pointer-events:none; user-select:none; }

  /* 조준점 */
  #cross { left:50%; top:50%; transform:translate(-50%,-50%); width:26px; height:26px; }
  #cross i { position:absolute; background:#eaf2ff; box-shadow:0 0 4px rgba(0,0,0,.8); transition:background .12s; }
  #cross i:nth-child(1){ left:50%; top:0; width:2px; height:8px; margin-left:-1px; }
  #cross i:nth-child(2){ left:50%; bottom:0; width:2px; height:8px; margin-left:-1px; }
  #cross i:nth-child(3){ top:50%; left:0; height:2px; width:8px; margin-top:-1px; }
  #cross i:nth-child(4){ top:50%; right:0; height:2px; width:8px; margin-top:-1px; }
  #cross.lock i { background:#4dffc3; }

  /* 상태 HUD */
  #hud { right:16px; top:16px; width:250px; padding:12px 14px; border-radius:10px;
    background:rgba(10,14,22,.72); border:1px solid rgba(120,160,220,.22); font-size:12.5px; line-height:1.75;
    backdrop-filter: blur(6px); }
  #hud b { color:#8fb6ff; font-weight:600; }
  #hud .row { display:flex; justify-content:space-between; gap:10px; }
  #hud .v { font-variant-numeric: tabular-nums; color:#cfe0ff; }
  #hud .ok { color:#4dffc3; }
  #hud .no { color:#7c8798; }
  #hud .t { font-size:11px; letter-spacing:.08em; color:#6f8bb5; margin-bottom:6px; }

  /* 설정 패널 */
  #panel { left:16px; top:16px; width:262px; padding:14px; border-radius:10px; pointer-events:auto;
    background:rgba(10,14,22,.82); border:1px solid rgba(120,160,220,.22); font-size:12.5px;
    backdrop-filter: blur(6px); }
  #panel h3 { margin:0 0 10px; font-size:12px; letter-spacing:.08em; color:#6f8bb5; font-weight:600; }
  #panel label { display:block; margin:9px 0 2px; color:#b9c8de; }
  #panel .val { float:right; color:#8fb6ff; font-variant-numeric: tabular-nums; }
  #panel input[type=range] { width:100%; accent-color:#4d8cff; margin:0; }
  #panel .chk { display:flex; align-items:center; gap:8px; margin-top:12px; color:#b9c8de; cursor:pointer; }
  #panel .keys { margin-top:12px; padding-top:10px; border-top:1px solid rgba(120,160,220,.18);
    color:#7c8798; font-size:11.5px; line-height:1.7; }
  #panel .keys kbd { background:#1b2434; border:1px solid #2c3a52; border-radius:4px; padding:0 5px; color:#cfe0ff; }

  /* 시작 안내 */
  #start { inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
    background:rgba(6,9,15,.55); }
  #start .box { text-align:center; }
  #start h1 { margin:0 0 10px; font-size:26px; font-weight:700; letter-spacing:-.01em; }
  #start p { margin:4px 0; color:#9fb2cc; font-size:14px; }
  #start .cta { margin-top:18px; display:inline-block; padding:10px 22px; border-radius:8px;
    background:#2f6bff; color:#fff; font-weight:600; font-size:14px; }
  #start.hide { display:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="ui" id="cross"><i></i><i></i><i></i><i></i></div>

<div class="ui" id="hud">
  <div class="t">타겟 포커스 상태</div>
  <div id="hudBody"></div>
</div>

<div class="ui" id="panel">
  <h3>설정</h3>
  <label>감지 거리 <span class="val" id="vDist">18 m</span></label>
  <input type="range" id="sDist" min="3" max="40" step="1" value="18">
  <label>화면 영역 (중심 반경) <span class="val" id="vArea">18 %</span></label>
  <input type="range" id="sArea" min="3" max="50" step="1" value="18">
  <label>회전 속도 <span class="val" id="vRot">6.0</span></label>
  <input type="range" id="sRot" min="1" max="20" step="0.5" value="6">
  <label>마우스 감도 <span class="val" id="vSens">2.2</span></label>
  <input type="range" id="sSens" min="0.5" max="6" step="0.1" value="2.2">
  <label>시야각 (FOV) <span class="val" id="vFov">75°</span></label>
  <input type="range" id="sFov" min="55" max="110" step="1" value="75">
  <label class="chk"><input type="checkbox" id="cAssist" checked> 타겟 포커스 켜기 <kbd>Tab</kbd></label>
  <label class="chk"><input type="checkbox" id="cZone" checked> 감지 영역 표시</label>
  <div class="keys">
    <kbd>W A S D</kbd> 이동 · <kbd>Shift</kbd> 달리기 · <kbd>Space</kbd> 점프<br>
    <kbd>마우스</kbd> 시점 · <kbd>Esc</kbd> 마우스 해제(설정 조작) · <kbd>H</kbd> UI 숨기기
  </div>
</div>

<div class="ui" id="start">
  <div class="box">
    <h1>1인칭 컨트롤러 + 타겟 포커스</h1>
    <p>지정 물체가 <b>거리</b>와 <b>화면 영역</b> 조건을 동시에 만족하면</p>
    <p>시점이 자동으로 회전해 화면 정중앙에 맞춥니다.</p>
    <div class="cta">화면을 클릭해서 시작</div>
  </div>
</div>

<script>
/* ============================================================
   순수 JS 소프트웨어 3D 렌더러 (외부 라이브러리 0개)
   ============================================================ */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth; VH = window.innerHeight;
  canvas.width = Math.floor(VW * DPR); canvas.height = Math.floor(VH * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

/* ---------- 설정 ---------- */
const cfg = { maxDist:18, areaPct:18, rotSpeed:6, sens:2.2, fov:75, assist:true, zone:true };

/* ---------- 플레이어 ---------- */
const EYE = 1.7;
const p = { x:0, y:EYE, z:-11, yaw:0, pitch:0, vy:0, ground:true };

/* ---------- 월드 ---------- */
const objs = [];
function box(x, y, z, w, h, d, color, opt){
  const o = Object.assign({
    x0:x-w/2, x1:x+w/2, y0:y, y1:y+h, z0:z-d/2, z1:z+d/2,
    cx:x, cy:y+h/2, cz:z, color:color, target:false, name:'', solid:true
  }, opt||{});
  objs.push(o); return o;
}
// 지형지물
box(-9, 0, 4, 1.2, 4.0, 1.2, [64,74,92]);
box( 9, 0, 4, 1.2, 4.0, 1.2, [64,74,92]);
box( 0, 0,16, 16, 3.2, 1.0, [58,66,84]);
box(-14,0, 2, 1.0, 3.2, 22,  [58,66,84]);
box( 14,0, 2, 1.0, 3.2, 22,  [58,66,84]);
box(-4, 0, 9, 2.4, 1.0, 2.4, [78,88,108]);
box( 5, 0,-2, 2.0, 0.6, 4.0, [78,88,108]);
box( 0, 0, 2, 3.0, 0.35,3.0, [70,80,100]);

// 지정 물체(타겟)
const targets = [];
function target(x, y, z, color, name){
  const o = box(x, y, z, 0.9, 0.9, 0.9, color, { target:true, name:name, solid:false });
  targets.push(o); return o;
}
target(-6.5, 1.2,  6.0, [255,96,120],  'TARGET A');
target( 6.5, 0.9, -1.0, [255,190,70],  'TARGET B');
target( 0.0, 2.4, 12.0, [90,200,255],  'TARGET C');
target(-2.5, 0.5, -6.0, [180,120,255], 'TARGET D');
target( 11.0,1.6,  9.0, [120,255,150], 'TARGET E');
target(-11.5,3.0, -3.0, [255,140,220], 'TARGET F');

/* ---------- 수학 ---------- */
const LIGHT = (() => { const v=[0.45,0.82,-0.35]; const l=Math.hypot(...v); return v.map(a=>a/l); })();
function focal(){ return (VH/2) / Math.tan(cfg.fov * Math.PI/180 / 2); }
function toView(dx, dy, dz){
  const cy = Math.cos(p.yaw), sy = Math.sin(p.yaw);
  const x1 =  dx*cy - dz*sy;
  const z1 =  dx*sy + dz*cy;
  const cp = Math.cos(p.pitch), sp = Math.sin(p.pitch);
  return [x1, dy*cp - z1*sp, dy*sp + z1*cp];
}
function project(v, f){ return [VW/2 + v[0]/v[2]*f, VH/2 - v[1]/v[2]*f]; }
function clipNear(poly){
  const N = 0.12, out = [];
  for (let i = 0; i < poly.length; i++){
    const a = poly[i], b = poly[(i+1) % poly.length];
    const ai = a[2] >= N, bi = b[2] >= N;
    if (ai) out.push(a);
    if (ai !== bi){
      const t = (N - a[2]) / (b[2] - a[2]);
      out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, N]);
    }
  }
  return out;
}
function angNorm(a){ while (a >  Math.PI) a -= Math.PI*2; while (a < -Math.PI) a += Math.PI*2; return a; }

/* ---------- 입력 ---------- */
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Tab'){ e.preventDefault(); cfg.assist = !cfg.assist; el('cAssist').checked = cfg.assist; }
  if (e.code === 'KeyH'){ document.body.classList.toggle('nohud'); syncHud(); }
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('click', () => canvas.requestPointerLock());
document.getElementById('start').addEventListener('click', () => canvas.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === canvas;
  document.getElementById('start').classList.toggle('hide', locked);
});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvas) return;
  p.yaw   += e.movementX * cfg.sens * 0.001;
  p.pitch -= e.movementY * cfg.sens * 0.001;
  const lim = Math.PI/2 - 0.02;
  p.pitch = Math.max(-lim, Math.min(lim, p.pitch));
});

/* ---------- 설정 UI ---------- */
function el(id){ return document.getElementById(id); }
function bind(sid, vid, key, fmt, scale){
  const s = el(sid);
  const upd = () => { const v = parseFloat(s.value); cfg[key] = scale ? v*scale : v; el(vid).textContent = fmt(v); };
  s.addEventListener('input', upd); upd();
}
bind('sDist','vDist','maxDist', v => v + ' m');
bind('sArea','vArea','areaPct', v => v + ' %');
bind('sRot', 'vRot', 'rotSpeed',v => v.toFixed(1));
bind('sSens','vSens','sens',    v => v.toFixed(1));
bind('sFov', 'vFov', 'fov',     v => v + '°');
el('cAssist').addEventListener('change', e => cfg.assist = e.target.checked);
el('cZone').addEventListener('change', e => cfg.zone = e.target.checked);
function syncHud(){
  const hide = document.body.classList.contains('nohud');
  for (const id of ['hud','panel']) el(id).style.display = hide ? 'none' : '';
}

/* ---------- 이동 & 충돌 ---------- */
const RAD = 0.36;
function blocked(x, z){
  for (const o of objs){
    if (!o.solid) continue;
    if (p.y - EYE > o.y1 - 0.05) continue;
    if (x > o.x0-RAD && x < o.x1+RAD && z > o.z0-RAD && z < o.z1+RAD) return true;
  }
  return false;
}
function movePlayer(dt){
  let fx = 0, fz = 0;
  if (keys['KeyW']) fz += 1;
  if (keys['KeyS']) fz -= 1;
  if (keys['KeyD']) fx += 1;
  if (keys['KeyA']) fx -= 1;
  const len = Math.hypot(fx, fz);
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 8.2 : 4.6;
  if (len > 0){
    fx /= len; fz /= len;
    const cy = Math.cos(p.yaw), sy = Math.sin(p.yaw);
    const dx = ( fz*sy + fx*cy) * speed * dt;
    const dz = ( fz*cy - fx*sy) * speed * dt;
    if (!blocked(p.x+dx, p.z)) p.x += dx;
    if (!blocked(p.x, p.z+dz)) p.z += dz;
  }
  if (keys['Space'] && p.ground){ p.vy = 6.4; p.ground = false; }
  p.vy -= 19.6 * dt;
  p.y += p.vy * dt;
  if (p.y <= EYE){ p.y = EYE; p.vy = 0; p.ground = true; }
}

/* ---------- 타겟 포커스 ---------- */
let locked = null;
let lockT = 0;
function updateFocus(dt){
  const f = focal();
  const R = VH * cfg.areaPct / 100;
  let best = null, bestScore = Infinity;

  for (const t of targets){
    const dx = t.cx - p.x, dy = t.cy - p.y, dz = t.cz - p.z;
    t._dist = Math.hypot(dx, dy, dz);
    const v = toView(dx, dy, dz);
    t._front = v[2] > 0.12;
    if (t._front){
      const s = project(v, f);
      t._sx = s[0]; t._sy = s[1];
      t._sd = Math.hypot(s[0]-VW/2, s[1]-VH/2);
    } else { t._sx = t._sy = null; t._sd = Infinity; }

    // 조건: 거리 이내 AND 화면 중심 반경 이내 AND 전방
    t._inDist = t._dist <= cfg.maxDist;
    t._inArea = t._sd <= R;
    t._hit = t._front && t._inDist && t._inArea;

    // 히스테리시스: 이미 잠긴 타겟은 조금 벗어나도 유지
    const keep = (locked === t) && t._front && t._dist <= cfg.maxDist*1.25 && t._sd <= R*1.6;
    if (t._hit || keep){
      const score = t._sd + t._dist * 4;
      if (score < bestScore){ bestScore = score; best = t; }
    }
  }

  if (best !== locked){ locked = best; lockT = 0; }
  if (locked){
    lockT += dt;
    if (cfg.assist){
      const dx = locked.cx - p.x, dy = locked.cy - p.y, dz = locked.cz - p.z;
      const wantYaw   = Math.atan2(dx, dz);
      const wantPitch = Math.atan2(dy, Math.hypot(dx, dz));
      const k = 1 - Math.exp(-cfg.rotSpeed * dt);
      p.yaw   += angNorm(wantYaw - p.yaw) * k;
      p.pitch += (wantPitch - p.pitch) * k;
    }
  }
}

/* ---------- 렌더 ---------- */
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  const h = Math.max(-1, Math.min(1, p.pitch));
  g.addColorStop(0, '#0d1424');
  g.addColorStop(Math.max(0.05, 0.5 + h*0.35), '#1d2b45');
  g.addColorStop(1, '#0a0d14');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}
function drawGround(f){
  const S = 60;
  const quad = [[-S,0,-S],[S,0,-S],[S,0,S],[-S,0,S]].map(v => toView(v[0]-p.x, v[1]-p.y, v[2]-p.z));
  const cq = clipNear(quad);
  if (cq.length >= 3){
    ctx.beginPath();
    cq.forEach((v, i) => { const s = project(v, f); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); });
    ctx.closePath(); ctx.fillStyle = '#171f2e'; ctx.fill();
  }
  for (const pass of [0, 1]){
    ctx.strokeStyle = pass ? 'rgba(140,185,245,.34)' : 'rgba(120,160,220,.13)';
    ctx.lineWidth = pass ? 1.4 : 1;
    ctx.beginPath();
    for (let i = -30; i <= 30; i += 2){
      if ((i % 10 === 0) !== (pass === 1)) continue;
      for (const seg of [[[i,0,-30],[i,0,30]], [[-30,0,i],[30,0,i]]]){
        const c = clipNear(seg.map(v => toView(v[0]-p.x, v[1]-p.y, v[2]-p.z)));
        if (c.length < 2) continue;
        const a = project(c[0], f), b = project(c[1], f);
        ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
      }
    }
    ctx.stroke();
  }
}
const FACES = [
  [[0,1,2,3], [0,-1,0]], [[7,6,5,4], [0,1,0]],
  [[0,4,5,1], [0,0,-1]], [[2,6,7,3], [0,0,1]],
  [[3,7,4,0], [-1,0,0]], [[1,5,6,2], [1,0,0]]
];
function drawObjects(f){
  const list = [];
  for (const o of objs){
    const c = [
      [o.x0,o.y0,o.z0],[o.x1,o.y0,o.z0],[o.x1,o.y0,o.z1],[o.x0,o.y0,o.z1],
      [o.x0,o.y1,o.z0],[o.x1,o.y1,o.z0],[o.x1,o.y1,o.z1],[o.x0,o.y1,o.z1]
    ];
    const isLock = (o === locked);
    for (const [idx, n] of FACES){
      const w = idx.map(i => c[i]);
      const cx = (w[0][0]+w[2][0])/2, cy = (w[0][1]+w[2][1])/2, cz = (w[0][2]+w[2][2])/2;
      if (n[0]*(cx-p.x) + n[1]*(cy-p.y) + n[2]*(cz-p.z) >= 0) continue;   // 후면 제거
      const view = clipNear(w.map(v => toView(v[0]-p.x, v[1]-p.y, v[2]-p.z)));
      if (view.length < 3) continue;
      let depth = 0; for (const v of view) depth += v[2]; depth /= view.length;
      let sh = 0.42 + 0.58 * Math.max(0, n[0]*LIGHT[0] + n[1]*LIGHT[1] + n[2]*LIGHT[2]);
      if (o.target) sh = Math.min(1.35, sh + 0.35 + (isLock ? 0.25 + 0.12*Math.sin(lockT*9) : 0));
      const col = o.color.map(v => Math.min(255, Math.round(v * sh)));
      list.push({ depth, view, fill: 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')',
                  edge: o.target ? (isLock ? '#eafff7' : 'rgba(255,255,255,.5)') : 'rgba(0,0,0,.35)' });
    }
  }
  list.sort((a, b) => b.depth - a.depth);
  ctx.lineWidth = 1;
  for (const it of list){
    ctx.beginPath();
    it.view.forEach((v, i) => { const s = project(v, f); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); });
    ctx.closePath();
    ctx.fillStyle = it.fill; ctx.fill();
    ctx.strokeStyle = it.edge; ctx.stroke();
  }
}
function drawMarkers(f){
  const R = VH * cfg.areaPct / 100;
  if (cfg.zone){
    ctx.save();
    ctx.setLineDash([6, 8]);
    ctx.strokeStyle = locked ? 'rgba(77,255,195,.45)' : 'rgba(140,175,225,.22)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(VW/2, VH/2, R, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  ctx.font = '600 11px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = 'center';
  for (const t of targets){
    if (!t._front) continue;
    const size = Math.max(16, 1.6 * 0.9 * f / Math.max(1.2, t._dist));
    const isLock = (t === locked);
    const col = isLock ? '#4dffc3' : (t._inDist ? 'rgba(255,214,102,.85)' : 'rgba(150,168,196,.45)');
    const x = t._sx, y = t._sy, h = size/2;
    const g = isLock ? h * (1 + 0.10*Math.sin(lockT*10)) : h;
    ctx.strokeStyle = col; ctx.lineWidth = isLock ? 2.2 : 1.4;
    ctx.beginPath();
    const arm = g * 0.42;
    for (const [sx, sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
      ctx.moveTo(x + sx*g, y + sy*g - sy*arm); ctx.lineTo(x + sx*g, y + sy*g);
      ctx.lineTo(x + sx*g - sx*arm, y + sy*g);
    }
    ctx.stroke();
    ctx.fillStyle = col;
    ctx.fillText(t.name + '  ' + t._dist.toFixed(1) + 'm', x, y - g - 7);
  }
  ctx.textAlign = 'left';
}
function drawVignette(){
  const g = ctx.createRadialGradient(VW/2, VH/2, Math.min(VW,VH)*0.35, VW/2, VH/2, Math.max(VW,VH)*0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
}

/* ---------- HUD ---------- */
const hudBody = el('hudBody');
let hudTick = 1;
function drawHud(){
  const R = (VH * cfg.areaPct / 100);
  const rows = targets.map(t => {
    const d = t._dist.toFixed(1).padStart(4);
    const a = t._front ? (t._sd / R * 100).toFixed(0) + '%' : '—';
    const st = (t === locked) ? '<span class="ok">● LOCK</span>'
             : t._hit ? '<span class="ok">조건충족</span>'
             : '<span class="no">' + (t._inDist ? '영역밖' : '거리밖') + '</span>';
    return '<div class="row"><span>' + t.name.replace('TARGET ','T-') + '</span>' +
           '<span class="v">' + d + 'm / ' + a + '</span>' + st + '</div>';
  }).join('');
  hudBody.innerHTML =
    '<div class="row"><span>포커스</span><span class="' + (cfg.assist ? 'ok' : 'no') + '">' +
      (cfg.assist ? 'ON' : 'OFF') + '</span></div>' +
    '<div class="row"><span>조건</span><span class="v">' + cfg.maxDist + 'm · 중심 ' + cfg.areaPct + '%</span></div>' +
    '<div class="row"><span>대상</span><span class="v">' + (locked ? locked.name : '없음') + '</span></div>' +
    '<div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(120,160,220,.18)">' + rows + '</div>';
}

/* ---------- 루프 ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  movePlayer(dt);
  updateFocus(dt);
  const f = focal();
  drawSky();
  drawGround(f);
  drawObjects(f);
  drawMarkers(f);
  drawVignette();
  el('cross').classList.toggle('lock', !!locked);
  hudTick += dt;
  if (hudTick > 0.08){ hudTick = 0; drawHud(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
